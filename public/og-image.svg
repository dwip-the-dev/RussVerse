<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="40%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>

    <!-- Crimson Brand Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4a5a" />
      <stop offset="50%" stop-color="#d9381e" />
      <stop offset="100%" stop-color="#9a1b10" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Geometric Grid Matrix -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Neo-Brutalist Frame Border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="url(#crimsonGrad)" stroke-width="8" rx="24" />

  <!-- Left Centerpiece: RussVerse Badge Emblem -->
  <g transform="translate(100, 155)" filter="url(#cardShadow)">
    <rect width="320" height="320" rx="48" fill="url(#crimsonGrad)" stroke="#ffffff" stroke-width="8" />
    <circle cx="160" cy="160" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.5" />
    
    <!-- Bold Cyrillic "Я" -->
    <path d="M 185 85 
             L 225 85 
             L 225 245 
             L 185 245 
             L 185 180 
             L 145 180 
             L 105 245 
             L 65 245 
             L 115 170 
             C 90 160 75 135 75 115 
             C 75 90 95 85 125 85 
             Z 
             M 185 115 
             L 130 115 
             C 115 115 110 120 110 130 
             C 110 140 115 145 130 145 
             L 185 145 
             Z" 
          fill="#ffffff" 
          stroke="#111827" 
          stroke-width="8" 
          stroke-linejoin="round" />
    
    <!-- Golden Lightning Streak -->
    <path d="M 235 160 L 205 220 L 225 220 L 210 270 L 260 205 L 235 205 Z" 
          fill="url(#goldGrad)" 
          stroke="#111827" 
          stroke-width="6" 
          stroke-linejoin="round" />
  </g>

  <!-- Right Content: Title & SEO Value Props -->
  <g transform="translate(480, 140)">
    <!-- Pill Badge -->
    <rect width="310" height="40" rx="8" fill="#d9381e" fill-opacity="0.2" stroke="#d9381e" stroke-width="2" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffd166" letter-spacing="2">
      🇷🇺 RUSSIAN LANGUAGE MASTERY
    </text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="'Space Grotesk', system-ui, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1">
      RussVerse
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="165" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="600" fill="#94a3b8">
      Offline-First 220-Unit CEFR A1–C1 Russian Curriculum
    </text>

    <!-- Feature Grid Badges -->
    <g transform="translate(0, 215)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="180" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <text x="16" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
        ⚡ 220 Units
      </text>

      <!-- Badge 2 -->
      <rect x="195" y="0" width="205" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <text x="16" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" transform="translate(195, 0)">
        🎙️ Cyrillic Speech
      </text>

      <!-- Badge 3 -->
      <rect x="415" y="0" width="195" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <text x="16" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" transform="translate(415, 0)">
        🧠 SM-2 Spaced Rep
      </text>
    </g>

    <!-- Bottom URL Footer -->
    <text x="0" y="325" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffd166">
      https://russverse.vercel.app
    </text>
  </g>
</svg>
